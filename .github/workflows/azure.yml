name: azure-dev
on:
  pull_request:
  push:
    branches: [main]
    paths: ["stacks/azure-dev/**", ".github/workflows/azure.yml"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

defaults:
  run:
    working-directory: stacks/azure-dev

jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Terraform init (remote state, OIDC)
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=rg-tfstate"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=azure-dev.tfstate"
      - run: terraform fmt -check
      - run: terraform validate -no-color
      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -input=false > plan.txt
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -c 60000 plan.txt; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

  apply:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Terraform init (remote state, OIDC)
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=rg-tfstate"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=azure-dev.tfstate"
      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -no-color
